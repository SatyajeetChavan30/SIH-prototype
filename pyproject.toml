[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jalraksha"
version = "0.0.1-alpha"
description = "Dam-break inundation modelling system combining 2D SWE solver with 3D SPH near-field dynamics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "JalRaksha Team", email = "jalraksha@sih2026.local"}
]
keywords = ["dam-break", "flood", "inundation", "shallow-water", "SPH", "HADR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    # Core numerical
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",

    # Spatial/geospatial
    "rasterio>=1.3.0",
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",

    # Data I/O
    "xarray>=2023.01.0",
    "netCDF4>=1.6.0",
    "h5py>=3.8.0",

    # Config/CLI
    "pyyaml>=6.0",
    "click>=8.1.0",

    # SPH solver (BSD licence, approved for redistribution)
    "pysph>=0.9b0",

    # Visualization
    "matplotlib>=3.7.0",

    # Misc
    "tqdm>=4.65.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "mypy>=1.5.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
]

viz = [
    "matplotlib>=3.7.0",
    "cartopy>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/sih2026/jalraksha"
Documentation = "https://github.com/sih2026/jalraksha/wiki"
Repository = "https://github.com/sih2026/jalraksha.git"
"Bug Tracker" = "https://github.com/sih2026/jalraksha/issues"

[project.scripts]
jalraksha = "jalraksha.cli:main"

[tool.setuptools]
packages = ["jalraksha", "jalraksha.solver", "jalraksha.terrain", "jalraksha.export", "jalraksha.sph"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
jalraksha = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=jalraksha --cov-report=term-missing"
markers = [
    "analytical: analytical exact-solution tests (Ritter, Stoker, Thacker)",
    "blocking: blocking correctness gates (lake-at-rest, mass-conservation, dry-bed)",
    "integration: end-to-end integration tests",
    "slow: slow tests (>10s)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.isort]
known-first-party = ["jalraksha"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = [
    "numba.*",
    "rasterio.*",
    "geopandas.*",
    "xarray.*",
    "pysph.*",
]
ignore_missing_imports = true
